# Replace DOMAIN with your actual domain (e.g. fitcalory.com)
# After certbot runs, it will auto-fill the ssl_* directives below.

server {
    listen 80;
    server_name DOMAIN www.DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN www.DOMAIN;

    # Certbot fills these automatically:
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve React build output
    root /var/www/fit-calory/client/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API to Express
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    # Proxy uploaded meal photos to Express
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # SPA fallback — all unknown paths serve index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
